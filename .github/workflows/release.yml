name: Validate and publish release
run-name: ${{ inputs.publish && 'Publish' || 'Validate' }} BactoScoop ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version expected in the current source
        type: string
        required: true
        default: '0.1.2'
      publish:
        description: Publish validated distributions to PyPI after owner approval
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: bactoscoop-pypi-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Govers-Lab/bactoscoop' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
      - name: Build and inspect the current release source
        id: metadata
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python -m pip install build twine tomli
          python -c "import os,tomli; p=tomli.load(open('pyproject.toml','rb'))['project']; assert p['version']==os.environ['EXPECTED_VERSION']; assert p['readme']=='README.md'; open(os.environ['GITHUB_OUTPUT'],'a').write('version='+p['version']+'\n')"
          python -m build
          python -m twine check --strict dist/*
          python .github/scripts/check_distributions.py dist --report package-check.json
      - name: Install the wheel and run all tests and both walkthroughs
        run: |
          python -m pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install dist/*.whl
          python -m pip check
          python .github/scripts/validate_release.py --examples examples --output release-check --tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-validation
          path: |
            package-check.json
            release-check/results.json
            release-check/*.log
          if-no-files-found: ignore
  publish:
    if: inputs.publish && github.repository == 'Govers-Lab/bactoscoop' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/bactoscoop/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
  verify-pypi:
    needs: [build, publish]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
      - name: Install the exact PyPI version and repeat the release validation
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python -m pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --index-url https://pypi.org/simple --no-cache-dir "bactoscoop==$RELEASE_VERSION"
          python -m pip check
          python .github/scripts/validate_release.py --examples examples --output pypi-check --tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pypi-validation
          path: |
            pypi-check/results.json
            pypi-check/*.log
          if-no-files-found: ignore
