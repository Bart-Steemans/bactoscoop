name: Publish stable release to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version expected in the current source
        type: string
        required: true
        default: '0.1.2'
      publish:
        description: Publish validated distributions to PyPI after owner approval
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: bactoscoop-pypi-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Bart-Steemans/bactoscoop' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Build and inspect the current release source
        id: metadata
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python -m pip install build twine tomli
          python -c "import os,tomli; p=tomli.load(open('pyproject.toml','rb'))['project']; assert p['version']==os.environ['EXPECTED_VERSION']; assert p['readme']=='README.md'; open(os.environ['GITHUB_OUTPUT'],'a').write('version='+p['version']+'\n')"
          python -m build
          python -m twine check --strict dist/*
          python tools/check_distributions.py dist --report package-check.json
      - name: Install the wheel and run all tests and both walkthroughs
        run: |
          python -m pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install dist/*.whl
          python -m pip check
          python tools/validate_release.py --examples examples --output release-check --tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-validation
          path: |
            package-check.json
            release-check/results.json
            release-check/*.log
          if-no-files-found: ignore
  publish:
    if: inputs.publish && github.repository == 'Bart-Steemans/bactoscoop' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/bactoscoop/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
  verify-pypi:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Install the exact PyPI version and repeat the release validation
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python -m pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --index-url https://pypi.org/simple --no-cache-dir "bactoscoop==$RELEASE_VERSION"
          python -m pip check
          python tools/validate_release.py --examples examples --output pypi-check --tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pypi-validation
          path: |
            pypi-check/results.json
            pypi-check/*.log
          if-no-files-found: ignore
