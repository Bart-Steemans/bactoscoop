name: Build and deploy documentation

on:
  push:
    branches: [main]
    paths:
      - 'bactoscoop/**'
      - 'examples/*.ipynb'
      - 'documentation/**'
      - 'pyproject.toml'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'SingleCellFeatures.xlsx'
      - 'BactoScoop Logo.png'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'Bart-Steemans/bactoscoop' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Build from package sources and saved notebook outputs
        run: |
          python -m pip install -r documentation/requirements-docs.txt
          python documentation/build.py
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: documentation/build/html
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
