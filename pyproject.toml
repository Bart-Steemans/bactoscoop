[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bactoscoop"
version = "0.1.2"
description = "Single-cell feature extraction from multichannel bacterial microscopy images"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bart Steemans" }]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24,<2",
    # Omnipose 1.0.6 depends on peakdetect's legacy scipy.ifft import.
    "scipy>=1.11.4,<1.12",
    # Omnipose still imports pkg_resources, removed by newer setuptools.
    "setuptools>=77.0.3,<81",
    "pandas>=2.1.3,<3",
    "tifffile>=2024.2.12",
    "natsort>=8.4",
    "shapely>=2.0.1",
    "scikit-image>=0.22",
    "opencv-python-headless>=4.9,<4.12",
    "networkx>=3.2",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "omnipose==1.0.6",
    "scikit-learn>=1.3",
    "pyarrow>=14",
    "jupyterlab>=4",
    "ipykernel>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1"]

[project.urls]
Documentation = "https://bart-steemans.github.io/bactoscoop/"
Changelog = "https://github.com/Bart-Steemans/bactoscoop/releases"
Homepage = "https://github.com/Bart-Steemans/bactoscoop"
Repository = "https://github.com/Bart-Steemans/bactoscoop"
Issues = "https://github.com/Bart-Steemans/bactoscoop/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["bactoscoop*"]
exclude = ["tests*"]

[tool.setuptools]
include-package-data = false
